spring.application.name=civic

# Server Port (supports AWS Elastic Beanstalk / ECS / Cloud container ports)
server.port=${PORT:8080}

# MySQL Database / AWS RDS Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:civicfix_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:taufiq123}}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# Local Storage Path (Default ./uploads/ inside project folder, cross-platform)
file.upload-dir=${FILE_UPLOAD_DIR:./uploads/}

# AWS S3 Cloud Storage Configuration
# Set AWS_S3_BUCKET_NAME on AWS to automatically store images in Amazon S3
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:}
aws.s3.region=${AWS_REGION:ap-south-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Multipart File Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,*}

# Gemini AI Vision Key (Supports GEMINI_API_KEY or GEMINI_API_KEY_ENV)
GEMINI_API_KEY=${GEMINI_API_KEY:${GEMINI_API_KEY_ENV:}}